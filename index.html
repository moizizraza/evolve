<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolve AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.16/mammoth.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CORE CSS --- */
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background-color: #050505;
            color: #e5e7eb;
        }

        /* --- ANIMATIONS --- */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 10px rgba(59, 130, 246, 0.2); }
            50% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes slideInFadeOut {
            0% { opacity: 0; transform: translateX(100%); }
            15% { opacity: 1; transform: translateX(0); }
            85% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(100%); }
        }

        /* --- COMPONENT STYLES --- */
        .chat-bubble {
            max-width: 85%;
            padding: 16px;
            border-radius: 16px;
            word-wrap: break-word;
            position: relative;
            margin-bottom: 12px;
            animation: slideUp 0.3s ease-out forwards;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .user-bubble { 
            background: linear-gradient(135deg, #1e3a8a 0%, #172554 100%);
            color: #F9FAFB;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        
        .assistant-bubble { 
            background-color: #1f2937; 
            color: #e5e7eb;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #374151;
            font-size: 1rem;
            line-height: 1.6;
        }

        /* Settings Panel Transition */
        #settings-panel {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateX(-100%);
            background-color: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(12px);
        }
        #settings-panel.open { transform: translateX(0); }
        
        /* Button Effects */
        .btn-click-effect:active {
            transform: scale(0.95);
            transition: transform 0.1s ease;
        }
        
        /* Menus */
        #focus-menu, #features-menu {
            transition: opacity 0.2s ease, transform 0.2s ease;
            transform-origin: bottom left;
        }

        /* Loader */
        .circular-loader {
            width: 20px;
            height: 20px;
            border: 2px solid #374151;
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* Toast Notification */
        .toast {
            background-color: #1f2937;
            color: #F9FAFB;
            padding: 12px 20px;
            border-radius: 10px;
            border-left: 4px solid #3b82f6;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateX(100%);
            animation: slideInFadeOut 4s ease-in-out forwards;
            font-weight: 500;
        }

        /* Code Blocks */
        .code-block {
            background-color: #0f172a;
            border-radius: 8px;
            padding: 16px;
            font-family: 'JetBrains Mono', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #a5b4fc;
            margin-top: 8px;
            border: 1px solid #1e293b;
            font-size: 0.9em;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { 
            background-color: #374151; 
            border-radius: 10px; 
        }
        ::-webkit-scrollbar-thumb:hover { background-color: #4b5563; }

        /* Login Screen Input Glow */
        #password-input:focus {
            animation: pulse-glow 2s infinite;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="bg-black text-gray-200 flex flex-col items-center justify-center h-screen selection:bg-blue-500 selection:text-white">
    <div id="toast-container" class="fixed top-5 right-5 z-[60] space-y-2"></div>

    <div id="password-modal" class="absolute inset-0 bg-black z-50 flex flex-col items-center justify-center p-8 text-center transition-opacity duration-700">
        <div class="w-full max-w-sm">
            <h2 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-600 mb-8 tracking-tighter">EVOLVE</h2>
            <form id="password-form" class="space-y-6">
                <div>
                    <input type="password" id="password-input"

                    AUTHENTICATE

            </form>
        </div>
    </div>
    
    <div id="main-app" class="w-full h-full flex-col items-center relative hidden opacity-0 transition-opacity duration-1000">
        
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-blue-900/10 via-transparent to-transparent pointer-events-none"></div>

        <div id="settings-panel" class="fixed top-0 left-0 h-full w-full sm:w-80 z-40 p-6 shadow-2xl flex flex-col overflow-y-auto border-r border-gray-800">
            <div class="flex items-center justify-between mb-8 flex-shrink-0">
                <h2 class="text-xl font-bold text-white tracking-wide">SYSTEM SETTINGS</h2>

            <div class="space-y-6">
                <div>

                    <input type="password" id="gemini-api-key-input" class="w-full bg-gray-800 border border-gray-700 text-white text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent block p-3 outline-none transition-all" placeholder="Enter Gemini API key">

                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
            </button>
            <div class="text-sm font-bold tracking-widest text-gray-600 uppercase">Evolve v2.0</div>
            <div class="w-10"></div> </div>

        <div id="chat-history" class="w-full max-w-4xl flex-grow overflow-y-auto px-4 sm:px-8 space-y-6 flex flex-col pt-20 pb-4 scroll-smooth">
            </div>

        <div class="w-full max-w-4xl p-4 sm:p-6 bg-transparent flex-shrink-0 z-20">
             <div id="processing-indicator" class="hidden flex items-center justify-center mb-3 space-x-2 h-6">
                <span class="text-xs font-mono text-blue-400 animate-pulse">PROCESSING REQUEST</span>

            </div>
            
            <div id="file-context-indicator" class="hidden flex items-center justify-between mb-3 text-sm text-gray-300 bg-gray-900/80 backdrop-blur border border-gray-700 px-4 py-2 rounded-xl shadow-lg slideUp">
                <div class="flex items-center overflow-hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2 text-blue-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>

                    <button id="clear-file-btn" class="p-1 rounded-full hover:bg-gray-700 text-gray-400 hover:text-red-400 transition-colors">

                    </button>
                </div>
            </div>

            <div class="bg-gray-900 border border-gray-700 rounded-3xl p-2 shadow-2xl relative transition-all duration-300 focus-within:border-blue-500/50 focus-within:ring-1 focus-within:ring-blue-500/50">
                <div class="flex items-end space-x-2">
                    <button id="upload-btn" class="p-3 rounded-full hover:bg-gray-800 text-gray-400 hover:text-white transition-colors btn-click-effect mb-0.5" title="Attach File">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" /></svg>
                    </button>
                    <input type="file" id="file-input" class="hidden" accept=".txt,.pdf,.docx">
                    
                    <div class="flex-grow py-3">

                    <button id="send-btn" class="p-3 rounded-full bg-blue-600 hover:bg-blue-500 text-white transition-all btn-click-effect shadow-lg shadow-blue-600/20 mb-0.5" title="Execute">

                    </button>
                </div>

                <div class="mt-2 flex items-center space-x-3 px-2 pb-1">

                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-blue-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd" /></svg>

                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-3 text-purple-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd" /></svg>
                                <span class="text-sm">Image Generation</span>
                            </button>
                            <button class="feature-option w-full text-left px-3 py-2.5 rounded-lg hover:bg-gray-700 flex items-center transition-colors" data-feature="code_gen">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-3 text-green-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.316 3.051a1 1 0 01.633 1.265l-4 12a1 1 0 11-1.898-.632l4-12a1 1 0 011.265-.633zM5.707 6.293a1 1 0 010 1.414L3.414 10l2.293 2.293a1 1 0 11-1.414 1.414l-3-3a1 1 0 010-1.414l3-3a1 1 0 011.414 0zm8.586 0a1 1 0 011.414 0l3 3a1 1 0 010 1.414l-3 3a1 1 0 11-1.414-1.414L16.586 10l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                                <span class="text-sm">Generate Code</span>
                            </button>
                        </div>
                    </div>

                    <div class="relative">
                         <button id="focus-btn" class="flex items-center space-x-2 px-3 py-1.5 bg-gray-800 rounded-full hover:bg-gray-700 transition-colors text-xs font-medium text-gray-300 border border-gray-700">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-orange-400" viewBox="0 0 20 20" fill="currentColor"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z" /><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.022 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" /></svg>
                            <span id="focus-label">General</span>
                        </button>
                        <div id="focus-menu" class="absolute bottom-12 left-0 bg-gray-800 border border-gray-700 rounded-xl p-1 space-y-1 hidden w-48 shadow-xl z-30">
                            <button class="focus-option w-full text-left px-3 py-2.5 rounded-lg hover:bg-gray-700 flex items-center transition-colors" data-focus="all">
                                <span class="text-sm">General</span>
                            </button>
                            <button class="focus-option w-full text-left px-3 py-2.5 rounded-lg hover:bg-gray-700 flex items-center transition-colors" data-focus="deep_research">
                                <span class="text-sm">Deep Research</span>
                            </button>
                            <button class="focus-option w-full text-left px-3 py-2.5 rounded-lg hover:bg-gray-700 flex items-center transition-colors" data-focus="math">
                                <span class="text-sm">Math & Logic</span>

                    <div class="flex-grow"></div>

                    <label class="flex items-center space-x-2 cursor-pointer group" title="Simulate web access">

                        <div class="relative">
                            <input type="checkbox" id="web-access-toggle" class="sr-only peer">
                            <div class="w-8 h-4 bg-gray-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-blue-600"></div>
                        </div>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer group" title="Enable context memory">
                        <span class="text-xs font-medium text-gray-500 group-hover:text-gray-300 transition-colors">Mem</span>
                        <div class="relative">
                            <input type="checkbox" id="memory-toggle" class="sr-only peer" checked>
                            <div class="w-8 h-4 bg-gray-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-blue-600"></div>
                        </div>
                    </label>
                </div>

        </div>
    </div>
    
    <script>
        // --- DOM References ---
        const dom = {
            mainApp: document.getElementById('main-app'),
            uploadBtn: document.getElementById('upload-btn'),
            fileInput: document.getElementById('file-input'),
            textPrompt: document.getElementById('text-prompt'),
            sendBtn: document.getElementById('send-btn'),
            chatHistory: document.getElementById('chat-history'),
            settingsPanel: document.getElementById('settings-panel'),
            openSettingsBtn: document.getElementById('open-settings-btn'),
            closeSettingsBtn: document.getElementById('close-settings-btn'),
            voiceSelect: document.getElementById('voice-select'),
            historyList: document.getElementById('history-list'),
            voiceToggle: document.getElementById('voice-toggle'),
            passwordModal: document.getElementById('password-modal'),
            passwordForm: document.getElementById('password-form'),
            passwordInput: document.getElementById('password-input'),
            passwordError: document.getElementById('password-error'),
            geminiApiKeyInput: document.getElementById('gemini-api-key-input'),
            focusBtn: document.getElementById('focus-btn'),
            focusLabel: document.getElementById('focus-label'),
            focusMenu: document.getElementById('focus-menu'),
            featuresBtn: document.getElementById('features-btn'),
            featuresMenu: document.getElementById('features-menu'),
            imageGenModal: document.getElementById('image-gen-modal'),
            closeImageGenBtn: document.getElementById('close-image-gen-btn'),
            imagePromptInput: document.getElementById('image-prompt-input'),
            generateImageBtn: document.getElementById('generate-image-btn'),
            generateImageText: document.getElementById('generate-image-text'),
            imageGenLoader: document.getElementById('image-gen-loader'),
            processingIndicator: document.getElementById('processing-indicator'),
            fileContextIndicator: document.getElementById('file-context-indicator'),
            fileContextName: document.getElementById('file-context-name'),
            clearFileBtn: document.getElementById('clear-file-btn'),
            summarizeFileBtn: document.getElementById('summarize-file-btn'),
            toastContainer: document.getElementById('toast-container'),
            webAccessToggle: document.getElementById('web-access-toggle'),
            memoryToggle: document.getElementById('memory-toggle')
        };
        
        // --- State ---
        let voices = [];
        let isVoiceEnabled = true;
        let geminiApiKey = localStorage.getItem('gemini-api-key') || '';
        let currentFocus = 'all';
        let fileContext = null;
        let webAccessEnabled = false;
        let memoryEnabled = true;
        let chatHistoryArray = [];

        // --- Voice Logic ---
        function populateVoiceList() {
            voices = speechSynthesis.getVoices();
            dom.voiceSelect.innerHTML = '';
            voices.forEach(voice => {
                let option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`;
                option.setAttribute('data-lang', voice.lang);
                option.setAttribute('data-name', voice.name);
                dom.voiceSelect.appendChild(option);
            });
            // Try to set a good default voice
            const preferredVoices = ["Google US English", "Samantha", "Microsoft Zira", "Natural"];
            let bestVoiceIndex = -1;
            for (let name of preferredVoices) {
                bestVoiceIndex = voices.findIndex(voice => voice.name.includes(name));
                if (bestVoiceIndex !== -1) break;
            }
            if (bestVoiceIndex >= 0) dom.voiceSelect.selectedIndex = bestVoiceIndex;
        }

        function speak(text, onEndCallback = () => {}) {
            if (!isVoiceEnabled || !text) return;
            speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            const selectedOption = dom.voiceSelect.selectedOptions[0];
            if (selectedOption) {
                const voiceName = selectedOption.getAttribute('data-name');
                const selectedVoice = voices.find(voice => voice.name === voiceName);
                if (selectedVoice) utterance.voice = selectedVoice;
            }
            utterance.rate = 1.0; 
            utterance.pitch = 1.0;
            utterance.onend = onEndCallback;
            speechSynthesis.speak(utterance);
        }

        // --- Initialization ---
        function initialize() {
            dom.geminiApiKeyInput.value = geminiApiKey;
            populateVoiceList();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = populateVoiceList;
            }
            if (!geminiApiKey) {
                showToast("System Ready. Please enter Google AI API Key in settings.");
            } else {
                showToast("System Online.");
            }
        }
        
        // --- UI Helpers ---
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            dom.toastContainer.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 4000);
        }

        function addMessageToChat(sender, message, type = 'text') {
            const bubble = document.createElement('div');
            const isUser = sender.toLowerCase() === 'user';
            
            // Container for bubble to handle alignment
            const container = document.createElement('div');
            container.className = `flex w-full ${isUser ? 'justify-end' : 'justify-start'}`;
            
            bubble.classList.add('chat-bubble', isUser ? 'user-bubble' : 'assistant-bubble');
            
            if (type === 'code') {
                const pre = document.createElement('pre');
                pre.className = 'code-block';
                pre.textContent = message;
                bubble.appendChild(pre);
            } else if (type === 'image') {
                const image = document.createElement('img');
                image.src = message;
                image.alt = "Generated visual";
                image.className = 'rounded-lg max-w-full h-auto border border-gray-600';
                bubble.appendChild(image);
            } else {
                // Parse simple markdown-like syntax for bold
                const formattedMessage = message.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                bubble.innerHTML = formattedMessage;
            }

            container.appendChild(bubble);
            dom.chatHistory.appendChild(container);
            dom.chatHistory.scrollTop = dom.chatHistory.scrollHeight;

            if (memoryEnabled && type === 'text') {
                chatHistoryArray.push({ role: isUser ? 'user' : 'model', parts: [{ text: message }] });
                if (chatHistoryArray.length > 20) chatHistoryArray = chatHistoryArray.slice(-20);
            }
        }

        // --- API Interaction ---
        async function processLlmRequest(command, isCodeGeneration = false) {
            if (!geminiApiKey) throw new Error("Authentication failed: API Key missing.");

            let systemPrompt = `You are Evolve, an advanced AI assistant. Be concise, precise, and helpful. Use markdown for formatting.`;
            
            if (isCodeGeneration) {
                 systemPrompt = `You are an expert coding engine. Generate clean, efficient, and well-commented code. Output ONLY the code within a code block, no conversational filler.`;
            } else if (fileContext) {
                systemPrompt += ` You have access to the file "${fileContext.name}". Content: ${fileContext.content.substring(0, 20000)}... (truncated if too long).`;
            } else if (webAccessEnabled) {
                systemPrompt += ` You are simulating web access capability. Provide up-to-date sounding information.`;
            }
            
            if (currentFocus === 'deep_research') systemPrompt += ` Adopt a rigorous, analytical persona. Provide detailed reasoning.`;
            else if (currentFocus === 'math') systemPrompt += ` Solve problems step-by-step.`;

            let requestContents = memoryEnabled ? [...chatHistoryArray] : [];
            requestContents.push({ role: "user", parts: [{ text: `${systemPrompt}\n\nUser: ${command}` }] });
            
            // Using flash model for speed
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`;
            
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: requestContents })
            });
            
            if (!response.ok) {
                 const error = await response.json();
                 throw new Error(error.error.message || "API Connection Failed");
            }
            const result = await response.json();
            return result.candidates?.[0]?.content?.parts?.[0]?.text || "No data received.";
        }
        
        async function handleUserCommand(command, isCodeGeneration = false) {
            addMessageToChat('User', command);
            dom.processingIndicator.classList.remove('hidden');
            dom.textPrompt.disabled = true;
            
            try {
                const responseText = await processLlmRequest(command, isCodeGeneration);
                addMessageToChat('Assistant', responseText, isCodeGeneration ? 'code' : 'text');
                
                // Speak only the first sentence or so to avoid long monologues
                if(!isCodeGeneration) {
                     const speakText = responseText.split('.')[0] + ".";
                     speak(speakText);
                } else {
                    speak("Code generated successfully.");
                }

            } catch (error) {
                console.error('Error:', error);
                addMessageToChat('Assistant', `Error: ${error.message}`);
                speak("An error occurred.");
            } finally {
                 dom.processingIndicator.classList.add('hidden');
                 dom.textPrompt.disabled = false;
                 dom.textPrompt.focus();
                 if (!memoryEnabled) chatHistoryArray = [];
            }
        }

        // --- Image Generation ---
        async function generateImage() {
            const userPrompt = dom.imagePromptInput.value.trim();
            if (!userPrompt) {
                showToast("Prompt required.");
                return;
            }
             if (!geminiApiKey) {
                showToast("API Key missing.");
                return;
            }

            dom.generateImageText.classList.add('hidden');
            dom.imageGenLoader.classList.remove('hidden');
            dom.generateImageBtn.disabled = true;

            try {
                // Attempting to use the image gen model (Pro Vision or specific endpoint depending on availability)
                // Note: Standard Gemini API usually returns text. For this demo, we simulate the request structure.
                // In a real production environment, you would hit the specific Imagen endpoint or DALL-E.
                // Since `gemini-1.5-flash` is text/multimodal-in, we will ask it to describe an image for now 
                // OR try the Pro vision endpoint if accessible. 
                
                // FALLBACK for demo purpose if pure image gen endpoint isn't active for the key:
                // We will just echo a placeholder. 
                // HOWEVER, assuming valid endpoint:
                
                 /* // Real implementation would look like this if the model supports it:
                 const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro-vision:generateContent?key=${geminiApiKey}`; 
                 */

                // For the sake of this single-file demo not breaking with standard keys, 
                // we will simulate the UI success.
                // To actually generate images, you need a specific model access.
                
                await new Promise(r => setTimeout(r, 2000)); // Simulate processing
                
                // Since we can't guarantee the user has an ImageGen enabled key, 
                // we'll throw a polite error or show a placeholder to demonstrate UI.
                // Uncomment below line to test UI with a placeholder:
                 const mockImage = "https://images.unsplash.com/photo-1620712943543-bcc4688e7485?q=80&w=1000&auto=format&fit=crop";
                 
                 closeImageGenModal();
                 addMessageToChat('User', `Generate visual: ${userPrompt}`);
                 addMessageToChat('Assistant', mockImage, 'image');
                 speak("Visual generated.");

            } catch (error) {
                showToast("Image generation failed.");
            } finally {
                dom.generateImageText.classList.remove('hidden');
                dom.imageGenLoader.classList.add('hidden');
                dom.generateImageBtn.disabled = false;
            }
        }

        async function summarizeFile() {
            if (!fileContext) return;
            handleUserCommand(`Summarize the attached file: ${fileContext.name}`);
        }

        // --- Event Listeners ---

        // Password / Boot Sequence
        dom.passwordForm.addEventListener('submit', (e) => {
            e.preventDefault();
            // PASSWORD CHANGED TO 1155
            if (dom.passwordInput.value === '1155') {
                dom.passwordModal.style.opacity = '0';
                
                setTimeout(() => {
                    dom.passwordModal.classList.add('hidden');
                    dom.mainApp.classList.remove('hidden');
                    dom.mainApp.classList.add('flex');
                    
                    // Trigger Boot Animation
                    setTimeout(() => {
                        dom.mainApp.style.opacity = '1';
                    }, 50);
                    
                    initialize();
                }, 700);
            } else {
                dom.passwordError.textContent = 'ACCESS DENIED';
                dom.passwordInput.value = '';
                dom.passwordInput.classList.add('border-red-500');
                setTimeout(() => dom.passwordInput.classList.remove('border-red-500'), 500);
            }
        });

        // Settings
        dom.openSettingsBtn.addEventListener('click', () => dom.settingsPanel.classList.add('open'));
        dom.closeSettingsBtn.addEventListener('click', () => dom.settingsPanel.classList.remove('open'));
        
        // Chat
        function submitTextPrompt() { const command = dom.textPrompt.value.trim(); if (command) { handleUserCommand(command); dom.textPrompt.value = ''; } }
        dom.sendBtn.addEventListener('click', submitTextPrompt);
        dom.textPrompt.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitTextPrompt(); } });
        
        // Toggles
        dom.voiceToggle.addEventListener('change', (e) => { isVoiceEnabled = e.target.checked; dom.voiceSelect.disabled = !isVoiceEnabled; if (!isVoiceEnabled) speechSynthesis.cancel(); });
        dom.geminiApiKeyInput.addEventListener('change', (e) => { geminiApiKey = e.target.value; localStorage.setItem('gemini-api-key', geminiApiKey); showToast('Key Saved.'); });
        
        // Menus
        dom.focusBtn.addEventListener('click', (e) => { e.stopPropagation(); dom.focusMenu.classList.toggle('hidden'); dom.featuresMenu.classList.add('hidden'); });
        dom.featuresBtn.addEventListener('click', (e) => { e.stopPropagation(); dom.featuresMenu.classList.toggle('hidden'); dom.focusMenu.classList.add('hidden'); });
        
        // Close menus on outside click
        document.addEventListener('click', (e) => {
            if (!dom.focusBtn.contains(e.target)) dom.focusMenu.classList.add('hidden');
            if (!dom.featuresBtn.contains(e.target)) dom.featuresMenu.classList.add('hidden');
        });

        // Focus Selection
        document.querySelectorAll('.focus-option').forEach(b => b.addEventListener('click', (e) => { 
            currentFocus = e.currentTarget.dataset.focus; 
            dom.focusLabel.textContent = e.currentTarget.querySelector('span').textContent; 
            dom.focusMenu.classList.add('hidden'); 
        }));
        
        // Feature Selection
        document.querySelectorAll('.feature-option').forEach(b => b.addEventListener('click', (e) => {
            const feature = e.currentTarget.dataset.feature;
            if (feature === 'image_gen') {
                dom.imageGenModal.classList.remove('hidden');
            } else if (feature === 'code_gen') {
                const command = prompt("Describe the code you need:");
                if (command) handleUserCommand(command, true);
            }
            dom.featuresMenu.classList.add('hidden');
        }));

        // Image Gen Modal
        dom.closeImageGenBtn.addEventListener('click', () => dom.imageGenModal.classList.add('hidden'));
        dom.generateImageBtn.addEventListener('click', generateImage);

        // Files
        dom.uploadBtn.addEventListener('click', () => dom.fileInput.click());
        dom.fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            dom.processingIndicator.classList.remove('hidden');
            let content = '';
            try {
                if (file.type === 'application/pdf') {
                    const reader = new FileReader();
                    reader.onload = async (event) => {
                        try {
                            const pdfData = new Uint8Array(event.target.result);
                            const pdf = await pdfjsLib.getDocument({data: pdfData}).promise;
                            for (let i = 1; i <= pdf.numPages; i++) {
                                const page = await pdf.getPage(i);
                                const textContent = await page.getTextContent();
                                content += textContent.items.map(item => item.str).join(' ');
                            }
                            fileContext = { name: file.name, content: content };
                            dom.fileContextName.textContent = file.name;
                            dom.fileContextIndicator.classList.remove('hidden');
                        } catch (e) { showToast("Error parsing PDF"); }
                        dom.processingIndicator.classList.add('hidden');
                    };
                    reader.readAsArrayBuffer(file);
                } else if (file.name.endsWith('.docx')) {
                     const reader = new FileReader();
                    reader.onload = async (event) => {
                        try {
                            const result = await mammoth.extractRawText({arrayBuffer: event.target.result});
                            fileContext = { name: file.name, content: result.value };
                            dom.fileContextName.textContent = file.name;
                            dom.fileContextIndicator.classList.remove('hidden');
                        } catch (e) { showToast("Error parsing DOCX"); }
                        dom.processingIndicator.classList.add('hidden');
                    };
                    reader.readAsArrayBuffer(file);
                } else {
                    content = await file.text();
                    fileContext = { name: file.name, content: content };
                    dom.fileContextName.textContent = file.name;
                    dom.fileContextIndicator.classList.remove('hidden');
                    dom.processingIndicator.classList.add('hidden');
                }
            } catch (error) {
                console.error(error);
                showToast("File upload failed.");
                dom.processingIndicator.classList.add('hidden');
            }
        });

        dom.clearFileBtn.addEventListener('click', () => {
            fileContext = null;
            dom.fileInput.value = '';
            dom.fileContextIndicator.classList.add('hidden');
        });
        dom.summarizeFileBtn.addEventListener('click', summarizeFile);
        
        dom.webAccessToggle.addEventListener('change', (e) => { webAccessEnabled = e.target.checked; showToast(`Web Link ${webAccessEnabled ? 'Active' : 'Inactive'}`); });
        dom.memoryToggle.addEventListener('change', (e) => { memoryEnabled = e.target.checked; if (!memoryEnabled) chatHistoryArray = []; showToast(`Memory ${memoryEnabled ? 'Active' : 'Purged'}`); });

    </script>
</body>
</html>
